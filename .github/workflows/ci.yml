name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node:
    name: Protocol core · Hub · JS SDK · apps typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  expo:
    name: Expo bundles (wallet + demo-chat, iOS + Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx expo export --platform ios --platform android --output-dir /tmp/export-wallet
        working-directory: apps/wallet
        env: { CI: '1' }
      - run: npx expo export --platform ios --platform android --output-dir /tmp/export-demo
        working-directory: apps/demo-chat
        env: { CI: '1' }

  android-sdk:
    name: Android Kotlin SDK + live interop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Start hub
        run: |
          MODELPASS_DATA_DIR=$RUNNER_TEMP/hub npm run hub > $RUNNER_TEMP/hub.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8787/healthz && break; sleep 1; done
      - run: gradle -p sdks/android -Pmodelpass.android=true :modelpass-core:test :modelpass-android:assembleRelease
        env: { MODELPASS_INTEROP_HUB: 'http://localhost:8787' }
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: android-sdk-test-reports
          path: sdks/android/modelpass-core/build/reports/tests/test/
